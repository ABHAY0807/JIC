<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#086b72" />
  <title>404 - Page Not Found | Jagruti Insurance Consultancy</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --ink: #0b2c3a;
      --teal: #086b72;
      --teal-light: #0d8b94;
      --gold: #f5af33;
      --mist: #f0f7f6;
      --white: #ffffff;
      --muted: #5e7784;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, #e2f2ef, #f0f7f6 60%, #fff8e8);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(8, 107, 114, 0.15);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(11, 44, 58, 0.08);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 2px solid #e2f2ef;
    }
    .code {
      font-family: 'Outfit', sans-serif;
      font-size: 64px;
      font-weight: 800;
      color: var(--teal);
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--teal);
      color: var(--white);
      font-weight: 600;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(8, 107, 114, 0.25);
    }
    .btn:hover {
      background: var(--teal-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(8, 107, 114, 0.35);
    }
  </style>
</head>

<body>
  <main class="card">
    <img src="logo.png" alt="Jagruti Insurance Consultancy Logo" class="logo" />
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <a href="/" class="btn">
      <span>← Back to Homepage</span>
    </a>
  </main>
</body>

</html>
